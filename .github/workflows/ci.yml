name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest
      - run: uv run --locked evogate --version
      - run: uv build
      - name: Check installed application
        run: |
          uv venv /tmp/evogate-installed --python 3.11
          uv pip install --python /tmp/evogate-installed/bin/python dist/*.whl
          cd /tmp
          /tmp/evogate-installed/bin/evogate --demo-report --workspace /tmp/evogate-demo
